<!-- title: Nos biens à vendre et à louer -->
<!-- description: Recherchez parmi tous les biens de l'agence : maisons, villas, appartements, terrains. Filtres par ville, prix, surface, pièces, équipements. -->
<!-- script: /biens.js -->
<section class="biens-page container">
  <nav class="crumbs" aria-label="Fil d'Ariane"><a href="/">Accueil</a><span>›</span><span>Nos biens</span></nav>
  <h1 class="h2" id="biensTitle">Nos biens</h1>
  <form class="filters" id="filters" novalidate>
    <div class="filters__tabs" role="tablist" aria-label="Transaction">
      <button type="button" role="tab" data-transaction="vente">Acheter</button>
      <button type="button" role="tab" data-transaction="location">Louer</button>
    </div>
    <div class="filters__grid">
      <label>Recherche<input name="q" type="search" placeholder="Ville, mot-clé, référence" autocomplete="off"><button type="button" class="voice" id="voiceBtn" aria-label="Recherche vocale" hidden>🎙</button></label>
      <label>Ville<select name="ville"><option value="">Toutes</option></select></label>
      <label>Type<select name="type"><option value="">Tous</option></select></label>
      <label>Prix min<input name="prixMin" inputmode="numeric" placeholder="€"></label>
      <label>Prix max<input name="prixMax" inputmode="numeric" placeholder="€"></label>
      <label>Surface min<input name="surfMin" inputmode="numeric" placeholder="m²"></label>
      <label>Pièces min<select name="piecesMin"><option value="">–</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label>Chambres min<select name="chambresMin"><option value="">–</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
    </div>
    <fieldset class="filters__equip"><legend>Équipements</legend><div id="equipList"></div></fieldset>
    <div class="filters__row">
      <label class="check"><input type="checkbox" name="vv"> Avec visite virtuelle</label>
      <label class="check"><input type="checkbox" name="clos"> Inclure les biens vendus / loués</label>
      <label>Trier par<select name="sort">
        <option value="recent">Plus récents</option><option value="ancien">Plus anciens</option>
        <option value="prix-asc">Prix croissant</option><option value="prix-desc">Prix décroissant</option>
        <option value="surface-desc">Surface décroissante</option><option value="surface-asc">Surface croissante</option>
      </select></label>
      <button type="button" class="btn btn--outline btn--sm" id="resetBtn">Réinitialiser</button>
    </div>
  </form>
  <p class="search-result" id="count" role="status"></p>
  <div class="grid-biens" id="results"></div>
  <p class="empty" id="empty" hidden>Aucun bien ne correspond à votre recherche. <a href="/#alertes">Créez une alerte</a> pour être prévenu(e) dès qu'un bien correspondant est publié.</p>
</section>
