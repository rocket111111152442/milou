[package]
name = "watchly-desktop"
version = "0.1.0"
description = "Watchly — application de surveillance (LULLIN WEB)"
authors = ["LULLIN WEB"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77"

[lib]
name = "watchly_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-notification = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.3"
tauri-plugin-updater = { version = "2.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json", "stream"] }
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread"] }
futures-util = "0.3"
url = "2.5"
thiserror = "2"
hostname = "0.4"
encoding_rs = "0.8"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
flate2 = "1"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "macros"] }

[features]
default = []
# Mises à jour signées : activées uniquement pour les builds de release disposant d'une clé de signature.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
