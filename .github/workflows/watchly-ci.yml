# Intégration continue de Watchly (dossier watchly/ uniquement).
# Aucun secret de production n'est utilisé : base PostgreSQL éphémère, Supabase local,
# stripe-mock (mode test Stripe simulé) et serveurs de test locaux.
name: Watchly CI

on:
  push:
    paths: ["watchly/**", ".github/workflows/watchly-ci.yml"]
  pull_request:
    paths: ["watchly/**", ".github/workflows/watchly-ci.yml"]
  workflow_dispatch:

concurrency:
  group: watchly-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: watchly

jobs:
  tests:
    name: Typage, lint, tests unitaires et d'intégration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ["12111:12111"]
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      STRIPE_MOCK_URL: http://localhost:12111
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: watchly/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: watchly/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Navigateur Chromium (tests du rendu des pages)
        run: |
          pnpm --filter @watchly/monitoring exec playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(pnpm --filter @watchly/monitoring exec node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  web-e2e:
    name: Site web — E2E (Supabase local, stripe-mock)
    runs-on: ubuntu-24.04
    needs: tests
    timeout-minutes: 40
    services:
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ["12111:12111"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: watchly/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: watchly/pnpm-lock.yaml
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: pnpm install --frozen-lockfile
      - name: Supabase local (Auth, Postgres, Mailpit)
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api,postgres-meta,supavisor
      - name: Configuration de test
        run: |
          eval "$(supabase status -o env)"
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DATABASE_URL="$DB" pnpm db:migrate
          DATABASE_URL="$DB" STRIPE_PRICE_PLUS=price_1PlusLocal STRIPE_PRICE_PRO=price_1ProLocal STRIPE_PRICE_BUSINESS=price_1BusinessLocal STRIPE_PRICE_BUSINESS_EXTRA_SITE=price_1ExtraLocal pnpm db:seed
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB"
            echo "WATCHLY_HASH_PEPPER=$(openssl rand -hex 32)"
            echo "STRIPE_SECRET_KEY=sk_test_123"
            echo "STRIPE_API_BASE=http://localhost:12111"
            echo "STRIPE_WEBHOOK_SECRET=whsec_ci_$(openssl rand -hex 16)"
          } > apps/web/.env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - run: pnpm --filter @watchly/web exec playwright install --with-deps chromium
      - run: pnpm --filter @watchly/web build
      - run: pnpm --filter @watchly/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-traces
          path: watchly/apps/web/test-results
          retention-days: 7

  desktop:
    name: Application desktop — tests Rust, interface et E2E (Linux)
    runs-on: ubuntu-24.04
    needs: tests
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (WebKitGTK, WebDriver, écran virtuel)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: watchly/apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: watchly/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: watchly/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @watchly/desktop build
      - name: Tests et lint Rust
        working-directory: watchly/apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
