# Construction des installateurs Waverti (Windows, macOS, Linux).
#
# Déclenchement : poussée d'un tag « waverti-desktop-vX.Y.Z » (la version doit correspondre à tauri.conf.json) ou
# lancement manuel (GitHub n'enregistre le lancement manuel que si le fichier existe sur la branche par défaut).
#
# Garde-fous :
# - les tests doivent passer avant toute construction ;
# - la version GitHub est d'abord créée en BROUILLON (draft) ; la dernière étape ne la publie (en PRÉ-VERSION, non
#   signée) que si le workflow « Waverti Desktop — plateformes » a réussi sur le même code. Sinon elle reste brouillon ;
# - le site n'affiche en téléchargement que les installateurs que la CI a réellement testés (marqueur dans la note) ;
# - signature Windows/macOS et mises à jour signées UNIQUEMENT si les secrets existent ;
#   sinon les installateurs sont construits NON SIGNÉS et la note de version le dit ;
# - un fichier SHA256SUMS.txt accompagne les installateurs.
#
# Variables / secrets attendus (Settings > Secrets and variables > Actions) :
#   vars.WAVERTI_API_URL                       (facultatif, https://… ; par défaut https://www.waverti.com)
#   secrets.TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD), vars.TAURI_UPDATER_PUBKEY   (mises à jour signées)
#   secrets.APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#           APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                               (signature + notarisation macOS)
#   secrets.WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD                     (signature Authenticode)
name: Waverti Desktop — installateurs

on:
  push:
    tags: ["waverti-desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 0.1.0) — doit correspondre à tauri.conf.json"
        required: true

env:
  WAVERTI_API_URL: ${{ vars.WAVERTI_API_URL || 'https://www.waverti.com' }}

permissions:
  contents: write

jobs:
  verify:
    name: Vérifications avant construction
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    defaults:
      run:
        working-directory: waverti
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="$INPUT_VERSION"; else V="${REF_NAME#waverti-desktop-v}"; fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version invalide : $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Version cohérente
        run: |
          CONF=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          test "$CONF" = "${{ steps.v.outputs.version }}" || { echo "tauri.conf.json=$CONF ≠ ${{ steps.v.outputs.version }}"; exit 1; }
      - name: Serveur cible défini
        run: test -n "$WAVERTI_API_URL" && [[ "$WAVERTI_API_URL" == https://* ]]
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: waverti/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: waverti/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project unit
      - run: pnpm --filter @waverti/desktop build
      - working-directory: waverti/apps/desktop/src-tauri
        run: cargo test

  build:
    name: Installateur ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: Linux, args: "" }
          - { os: windows-latest, label: Windows, args: "" }
          - { os: macos-latest, label: macOS (Apple Silicon), args: "--target aarch64-apple-darwin" }
          - { os: macos-latest, label: macOS (Intel), args: "--target x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: waverti/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: waverti/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: waverti
      - name: Mises à jour signées (si la clé existe)
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        working-directory: waverti/apps/desktop/src-tauri
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('tauri.updater.conf.json', 'utf8'));
            c.plugins.updater.pubkey = process.env.PUBKEY;
            fs.writeFileSync('tauri.updater.ci.json', JSON.stringify(c));
          "
          echo "UPDATER_ARGS=--features updater --config src-tauri/tauri.updater.ci.json" >> "$GITHUB_ENV"
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      - name: Certificat Windows (si disponible)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          [IO.File]::WriteAllBytes("cert.pfx", $bytes)
          Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force)
          Remove-Item cert.pfx
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: waverti/apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}
          tagName: waverti-desktop-v${{ needs.verify.outputs.version }}
          releaseName: Waverti ${{ needs.verify.outputs.version }} (bêta non signée)
          releaseBody: |
            Brouillon généré automatiquement — à vérifier et tester manuellement avant toute publication.
            Signature Windows : ${{ env.HAS_WINDOWS_CERT == 'true' && 'oui' || 'NON (installateur non signé)' }}
            Signature et notarisation macOS : ${{ env.HAS_APPLE_CERT == 'true' && 'oui' || 'NON (application non signée)' }}
            Mises à jour automatiques signées : ${{ env.HAS_UPDATER_KEY == 'true' && 'oui' || 'non activées' }}
            Sommes de contrôle : SHA256SUMS.txt
          releaseDraft: true
          prerelease: true

  checksums:
    name: Sommes de contrôle SHA-256
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Téléchargement des installateurs du brouillon et calcul des empreintes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: waverti-desktop-v${{ needs.verify.outputs.version }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "*" --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber

  publish:
    name: Publication en pré-version (si les tests de plateformes ont réussi)
    needs: [verify, checksums]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Les installateurs ont-ils été testés sur ce code ?
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Un run réussi de « plateformes » dont le code desktop, les paquets et l'API agent sont identiques à ceux de ce tag.
          WATCHED="waverti/apps/desktop waverti/packages waverti/apps/web/src/app/api/agent waverti/pnpm-lock.yaml"
          FOUND=""
          for SHA in $(gh run list --repo "${{ github.repository }}" --workflow waverti-desktop-platforms.yml --status success --limit 50 --json headSha --jq '.[].headSha'); do
            git cat-file -e "$SHA^{commit}" 2>/dev/null || continue
            if git diff --quiet "$SHA" "$GITHUB_SHA" -- $WATCHED; then FOUND="$SHA"; break; fi
          done
          if [ -z "$FOUND" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Aucun run réussi de « Waverti Desktop — plateformes » sur un code identique : la version reste en BROUILLON."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "sha=$FOUND" >> "$GITHUB_OUTPUT"
            echo "Tests de plateformes réussis sur $FOUND (code desktop identique)."
          fi
      - name: Publication en pré-version non signée
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: waverti-desktop-v${{ needs.verify.outputs.version }}
          TESTED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          # Marqueur lu par le site : seuls les installateurs listés ici sont proposés au téléchargement.
          cat > notes.md <<EOF
          Version bêta **non signée** : Windows (SmartScreen) et macOS (Gatekeeper) afficheront un avertissement. Vérifiez la somme de contrôle (SHA256SUMS.txt) si besoin.

          Testés automatiquement (code identique au run \`$TESTED_SHA\` du workflow « Waverti Desktop — plateformes ») :
          - Windows : installation, lancement et désinstallation des installateurs NSIS (.exe) et MSI ; E2E du binaire réel.
          - Linux : installation, lancement et désinstallation du paquet .deb ; E2E du binaire réel.
          - macOS (Apple Silicon) : application construite et lancée.

          Non proposés au téléchargement car non testés : AppImage, .rpm, macOS Intel.
          Aucun essai sur un ordinateur réel (hors machines de CI) n'a été fait.

          <!-- waverti-release {"tested":{"windows:nsis":"CI Windows : E2E du binaire réel, installation, lancement et désinstallation","windows:msi":"CI Windows : installation, lancement et désinstallation","linux:deb":"CI Ubuntu : E2E du binaire réel, installation, lancement et désinstallation","macos:dmg:aarch64":"CI macOS Apple Silicon : application construite et lancée"},"testedSha":"$TESTED_SHA"} -->
          EOF
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease=true --notes-file notes.md
          gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft,isPrerelease,assets --jq '{isDraft,isPrerelease,assets:[.assets[].name]}'
