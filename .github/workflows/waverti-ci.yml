# Intégration continue de Waverti (dossier waverti/ uniquement).
# Aucun secret de production n'est utilisé : PostgreSQL éphémère, Mailpit (e-mails de test),
# stripe-mock (mode test Stripe simulé) et serveurs de test locaux.
name: Waverti CI

on:
  push:
    paths: ["waverti/**", ".github/workflows/waverti-ci.yml"]
  pull_request:
    paths: ["waverti/**", ".github/workflows/waverti-ci.yml"]
  workflow_dispatch:

concurrency:
  group: waverti-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: waverti

jobs:
  tests:
    name: Typage, lint, tests unitaires et d'intégration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ["12111:12111"]
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      STRIPE_MOCK_URL: http://localhost:12111
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: waverti/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: waverti/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Navigateur Chromium (tests du rendu des pages)
        run: |
          pnpm --filter @waverti/monitoring exec playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(pnpm --filter @waverti/monitoring exec node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  web-e2e:
    name: Site web — E2E (PostgreSQL, Mailpit, stripe-mock)
    runs-on: ubuntu-24.04
    needs: tests
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ["12111:12111"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: waverti/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: waverti/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Configuration de test
        run: bash infra/ci/e2e-env.sh
      - run: pnpm --filter @waverti/web exec playwright install --with-deps chromium
      - run: pnpm --filter @waverti/web build
      - run: pnpm --filter @waverti/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-traces
          path: waverti/apps/web/test-results
          retention-days: 7

  desktop:
    name: Application desktop — tests Rust et E2E du binaire réel (Linux)
    runs-on: ubuntu-24.04
    needs: tests
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ["12111:12111"]
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (WebKitGTK, WebDriver, écran virtuel)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: waverti/apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: waverti/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: waverti/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @waverti/desktop build
      - name: Tests et lint Rust
        working-directory: waverti/apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      # E2E : binaire Tauri réel piloté par WebDriver contre le site, PostgreSQL et Mailpit locaux.
      - name: Configuration de test
        run: bash infra/ci/e2e-env.sh
      - name: Site web local
        run: |
          pnpm --filter @waverti/web build
          nohup pnpm --filter @waverti/web start > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/web.log"; exit 1
      - name: Chromium (validation du code de liaison) et tauri-driver
        run: |
          pnpm --filter @waverti/desktop exec playwright install --with-deps chromium
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Binaire desktop (debug)
        run: pnpm --filter @waverti/desktop tauri build --debug --no-bundle
      - name: E2E desktop
        run: DESKTOP_E2E=1 pnpm --filter @waverti/desktop test:e2e
