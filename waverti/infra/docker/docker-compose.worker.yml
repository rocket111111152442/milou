# Déploiement du worker sur un serveur (OVH VPS par exemple).
# Les secrets sont lus depuis worker.env (jamais versionné) : voir docs/ENVIRONMENT.md.
#   docker compose -f infra/docker/docker-compose.worker.yml up -d --build
services:
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    image: waverti-worker:latest
    env_file: ./worker.env
    environment:
      NODE_ENV: production
      WORKER_ROLES: scheduler,pages,web,business,email,maintenance
    restart: unless-stopped
    init: true
    # Chromium a besoin d'une mémoire partagée suffisante.
    shm_size: 1gb
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
