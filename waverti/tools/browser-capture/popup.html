<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relevé Waverti</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <h1>Envoyer une page à Waverti</h1>
      <p>Envoie l’adresse de la page ouverte et, si disponibles, son prix et son stock. Tu pourras vérifier le relevé dans Waverti.</p>
      <button type="button" id="capture">Utiliser l’onglet actif</button>
      <form id="paste">
        <label for="page-url">Ou colle une autre adresse</label>
        <input id="page-url" type="url" maxlength="2048" placeholder="https://…" autocomplete="off" required>
        <button type="submit">Ouvrir Waverti avec cette adresse</button>
      </form>
      <p role="status" id="status"></p>
    </main>
  </body>
</html>
